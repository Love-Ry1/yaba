apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yaba
resources:
  - namespace.yaml
  - secret.yaml
  - postgres.yaml
  - event-service.yaml
  - booking-service.yaml
  - frontend.yaml
images:
  - name: yaba/event-service
    newName: yaba/event-service
    newTag: latest
  - name: yaba/booking-service
    newName: yaba/booking-service
    newTag: latest
  - name: yaba/frontend
    newName: yaba/frontend
    newTag: latest
